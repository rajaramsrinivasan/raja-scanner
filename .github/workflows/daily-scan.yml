name: Raja Daily Market Scanner

on:
  schedule:
    # 8:15 AM IST. Must finish before the worker emails at 9:20, or the email
    # reads yesterday's Gist. A full scan with 1y of history takes 20-30 min.
    - cron: "45 2 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode - 30 stocks only?"
        required: false
        default: "false"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 1y of history per batch is a bigger payload than 2mo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run scanner
        env:
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIST_ID:           ${{ secrets.GIST_ID }}
          # GITHUB_TOKEN is a reserved name: Actions injects its own scoped
          # token under it and that token cannot write Gists. scanner.py reads
          # GIST_TOKEN first, then falls back to GH_PAT. Both are passed here so
          # whichever exists is used. The PAT needs the "gist" scope.
          GIST_TOKEN:        ${{ secrets.GIST_TOKEN }}
          GH_PAT:            ${{ secrets.GH_PAT }}
          GH_USERNAME:       ${{ secrets.GH_USERNAME }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python scanner.py --test
          else
            python scanner.py
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-results-${{ github.run_id }}
          path: results/
          retention-days: 30
